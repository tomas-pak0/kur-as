name: Android packages and background checks
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-packages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build unsigned release and emulator packages
        working-directory: android
        env:
          KURAS_UNSIGNED_CI: '1'
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: kur-as-0.5.7-candidates
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
  android16:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kur-as-0.5.7-candidates
          path: candidates
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install $(find candidates -name app-debug.apk)
            adb install $(find candidates -name app-debug-androidTest.apk)
            adb shell pm grant lt.tyliaitpk.kuras android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant lt.tyliaitpk.kuras android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant lt.tyliaitpk.kuras android.permission.READ_PHONE_STATE
            adb shell pm grant lt.tyliaitpk.kuras android.permission.POST_NOTIFICATIONS
            adb shell appops set lt.tyliaitpk.kuras android:mock_location allow
            adb shell am instrument -w lt.tyliaitpk.kuras.test/lt.tyliaitpk.kuras.SmokeInstrumentation | tee instrumentation.txt
            test $(grep -c 'status=passed' instrumentation.txt) -eq 1
            adb shell dumpsys power | grep 'mWakefulness=' > screen-state.txt
            adb exec-out screencap -p > screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kur-as-0.5.7-android16-validation
          path: |
            instrumentation.txt
            screen-state.txt
            screen.png
